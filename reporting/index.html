<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0C0F" media="(prefers-color-scheme: dark)">
<title>Long Post Factory — Reporting</title>
<style>
  /* Colours are tokenised so the dark block below only has to restate the
     tokens — previously every colour here was hardcoded and the page was
     pinned to `color-scheme: light`, so it stayed bright white while every
     other page in this repo followed the OS theme. */
  :root{
    color-scheme: light dark;
    --paper:#F2F4F8; --card:#FFFFFF; --card-2:#f8fafc;
    --ink:#1e293b; --ink-soft:#64748b; --ink-faint:#94a3b8; --th-ink:#475569;
    --line:#cbd5e1; --line-soft:#eef1f5;
    --accent:#2A4D9B; --accent-ink:#ffffff; --link:#2A4D9B;
    --shadow:0 1px 3px rgba(0,0,0,.08);
    --done-bg:#dcfce7; --done-ink:#166534;
    --pending-bg:#fef9c3; --pending-ink:#854d0e;
    --running-bg:#dbeafe; --running-ink:#1e40af;
    --failed-bg:#fee2e2; --failed-ink:#991b1b;
    --flagged-bg:#ffedd5; --flagged-ink:#9a3412;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --paper:#0B0C0F; --card:#16171C; --card-2:#1B1C22;
      --ink:#F2F2F5; --ink-soft:#93959E; --ink-faint:#6B6E76; --th-ink:#B6B8C0;
      --line:#26272E; --line-soft:#1E1F25;
      --accent:#1E2A4A; --accent-ink:#E8EAF2; --link:#9A9BFF;
      --shadow:0 1px 3px rgba(0,0,0,.5);
      /* status badges keep their hue but drop to dark-surface tints so the
         text stays legible instead of dark-on-bright */
      --done-bg:#0F2A20; --done-ink:#4ADE80;
      --pending-bg:#2C2107; --pending-ink:#FCD34D;
      --running-bg:#152449; --running-ink:#93B4FF;
      --failed-bg:#2E1613; --failed-ink:#FCA5A5;
      --flagged-bg:#2B1A0B; --flagged-ink:#FDBA74;
    }
  }
  body{ margin:0; background:var(--paper); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; color:var(--ink); }
  header{ background:var(--accent); color:var(--accent-ink); padding:20px 24px; }
  header h1{ margin:0; font-size:20px; }
  header p{ margin:6px 0 0; font-size:13px; opacity:.85; }
  main{ max-width:1100px; margin:0 auto; padding:20px; }
  .stats{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:20px; }
  .stat{ background:var(--card); border-radius:12px; padding:14px 18px; box-shadow:var(--shadow); min-width:120px; }
  .stat b{ display:block; font-size:22px; }
  .stat span{ font-size:12px; color:var(--ink-soft); }
  .controls{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .controls input, .controls select{ padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; background:var(--card); color:var(--ink); }
  table{ width:100%; border-collapse:collapse; background:var(--card); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
  th,td{ text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line-soft); vertical-align:top; }
  th{ background:var(--card-2); font-weight:700; color:var(--th-ink); position:sticky; top:0; }
  tr:last-child td{ border-bottom:none; }
  .badge{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .badge.done{ background:var(--done-bg); color:var(--done-ink); }
  .badge.pending{ background:var(--pending-bg); color:var(--pending-ink); }
  .badge.running{ background:var(--running-bg); color:var(--running-ink); }
  .badge.failed{ background:var(--failed-bg); color:var(--failed-ink); }
  .badge.flagged{ background:var(--flagged-bg); color:var(--flagged-ink); }
  a{ color:var(--link); }
  .msg{ padding:12px; color:var(--ink-soft); font-size:13px; }
  .small{ font-size:11px; color:var(--ink-faint); }
</style>
</head>
<body>
<header>
  <h1>📊 Long Post Factory — Reporting</h1>
  <p>What's been published, what's still queued, and each note's grounding signal.</p>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="controls">
    <input type="text" id="searchBox" placeholder="Search topic / exam / slug...">
    <select id="statusFilter">
      <option value="">All statuses</option>
      <option value="done">Done</option>
      <option value="pending">Pending</option>
      <option value="running">Running</option>
      <option value="failed">Failed</option>
    </select>
  </div>
  <table>
    <thead>
      <tr><th>Topic</th><th>Exam</th><th>Status</th><th>NCERT cites</th><th>Self-check</th><th>Published</th><th>Link</th></tr>
    </thead>
    <tbody id="rows"><tr><td colspan="7" class="msg">Loading…</td></tr></tbody>
  </table>
</main>
<script>
// Reads two repo-relative JSON sources — no secrets, safe on GitHub Pages:
//   ../automation/topics.json          — the batch checklist (pending/running/failed/done)
//   ../published-long-posts/index.json + per-slug files — actually published drafts
const TOPICS_URL = '../automation/topics.json';
const PUB_INDEX_URL = '../published-long-posts/index.json';
const PUB_FILE = slug => `../published-long-posts/${slug}.json`;

async function safeFetchJson(url, fallback){
  try{
    const res = await fetch(url, { cache: 'no-store' });
    if(!res.ok) return fallback;
    return await res.json();
  }catch(e){ return fallback; }
}

function badge(status){
  return `<span class="badge ${status}">${status}</span>`;
}

async function load(){
  const [topics, pubIndex] = await Promise.all([
    safeFetchJson(TOPICS_URL, []),
    safeFetchJson(PUB_INDEX_URL, [])
  ]);

  const published = await Promise.all(pubIndex.map(slug => safeFetchJson(PUB_FILE(slug), null)));
  const pubBySlug = new Map();
  published.filter(Boolean).forEach(p => pubBySlug.set(p.seo?.slug || p.slug, p));

  const rows = topics.map(t => {
    const pub = t.slug ? pubBySlug.get(t.slug) : null;
    return {
      topic: t.topic, exam: t.exam, status: t.status || 'pending',
      slug: t.slug, error: t.error,
      ncertCount: pub?.ncertCitationCount ?? null,
      selfCheckClean: pub?.selfCheck?.clean ?? null,
      selfCheckFlags: pub?.selfCheck?.flagCount ?? null,
      publishedAt: pub?.wordpress?.publishedAt || null,
      link: pub?.wordpress?.link || null
    };
  });

  // stats
  const counts = { done: 0, pending: 0, running: 0, failed: 0 };
  rows.forEach(r => { counts[r.status] = (counts[r.status]||0) + 1; });
  document.getElementById('stats').innerHTML = Object.entries(counts).map(([k,v]) =>
    `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('') +
    `<div class="stat"><b>${rows.length}</b><span>total topics</span></div>`;

  function render(){
    const q = document.getElementById('searchBox').value.trim().toLowerCase();
    const statusFilter = document.getElementById('statusFilter').value;
    const filtered = rows.filter(r => {
      if(statusFilter && r.status !== statusFilter) return false;
      if(!q) return true;
      return (r.topic||'').toLowerCase().includes(q) || (r.exam||'').toLowerCase().includes(q) || (r.slug||'').toLowerCase().includes(q);
    });
    const tbody = document.getElementById('rows');
    if(!filtered.length){ tbody.innerHTML = '<tr><td colspan="7" class="msg">No matching rows.</td></tr>'; return; }
    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td>${r.topic || ''}${r.error ? `<div class="small">⚠ ${r.error}</div>` : ''}</td>
        <td>${r.exam || ''}</td>
        <td>${badge(r.status)}</td>
        <td>${r.ncertCount === null ? '—' : r.ncertCount}</td>
        <td>${r.selfCheckClean === null ? '—' : (r.selfCheckClean ? '✅ clean' : `${badge('flagged')} ${r.selfCheckFlags} flag(s)`)}</td>
        <td>${r.publishedAt ? new Date(r.publishedAt).toLocaleDateString() : '—'}</td>
        <td>${r.link ? `<a href="${r.link}" target="_blank" rel="noopener">draft ↗</a>` : '—'}</td>
      </tr>`).join('');
  }
  document.getElementById('searchBox').addEventListener('input', render);
  document.getElementById('statusFilter').addEventListener('change', render);
  render();
}
load();
</script>
</body>
</html>
